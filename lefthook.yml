# push しようとしている範囲全体を secret scan する。
#
# WHY: pre-commit の betterleaks は staged 分しか見ないため、--no-verify で回避した
# コミットや、複数コミットにまたがる混入を取り逃がす。CI にも同じチェックがあるが、
# 検出されるのは push の「後」であり、秘密情報が一度リモートに出たら force push で
# 消しても漏洩済みという点で不可逆。だから push の前に一度だけ範囲で見る。
#
# ここに AI レビューは置かない。判定が非決定的で、差分自体がプロンプトになるため
# インジェクションで突破でき、門としては成立しない（レビューは変更内容に応じて
# 手動でエージェントを選ぶ運用、機械的に強制したい場合の置き場所は CI）。
pre-push:
  jobs:
    - name: betterleaks-range
      run: |
        base=$(git symbolic-ref --quiet --short refs/remotes/origin/HEAD 2>/dev/null || echo origin/main)
        git fetch --quiet origin || true
        if git rev-parse --verify --quiet "$base" >/dev/null; then
          mise exec -- betterleaks git --redact --log-opts="$base..HEAD"
        else
          mise exec -- betterleaks git --redact
        fi

pre-commit:
  parallel: true
  jobs:
    - name: betterleaks
      run: mise exec -- betterleaks git --pre-commit --redact --staged --verbose

    # Claude Code の破壊的コマンドガードの回帰テスト。
    # 誤って許可する側の退行は実行時に無音で通ってしまうため、ここで止める
    # （クラッシュ系の破損は次の Bash 呼び出しが全て失敗するので即座に気付ける）。
    - name: claude-hooks-test
      glob: ".claude/hooks/**/*.py"
      run: mise exec -- python3 .claude/hooks/tests/test_guard.py

    # フォーマッターは必ず npm exec / pnpm exec 経由で node_modules/.bin から引く。
    # 素の `biome` / `prettier` を PATH から叩くと、開発機に Homebrew などで別途
    # インストールされたものを拾う（実例: この設定を入れた時点の開発機には
    # Homebrew の biome 2.3.8 が入っており、リポジトリの 2.5.11 と食い違っていた）。
    # ロックファイルで固定された版を使うことが、CI と手元で整形結果を一致させる条件。
    - name: cdk-format
      root: "agent-app/agentcore/cdk/"
      glob: "*.{ts,json}"
      run: mise exec -- npm exec prettier -- --write {staged_files}
      stage_fixed: true

    - name: formecho-agent-format
      root: "agent-app/app/FormEchoAgent/"
      glob: "*.ts"
      run: mise exec -- npm exec biome -- check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - name: formecho-agent-typecheck
      root: "agent-app/app/FormEchoAgent/"
      glob: "*.ts"
      # tsconfig.test.json を使う。既定の tsconfig.json は emit するのでテストを
      # 除いており、そのままではテストの型崩れを手元で拾えない（CI と同じ script）。
      run: mise exec -- npm run typecheck

    - name: hono-app-format
      root: "hono-app/"
      glob: "*.ts"
      run: mise exec -- pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - name: hono-app-typecheck
      root: "hono-app/"
      glob: "*.ts"
      run: mise exec -- pnpm exec tsc --noEmit

    # nextjs-app は lint と format の担当が分かれている。lint は eslint-config-next
    # （core-web-vitals 等、biome に等価物が無いルールを持つ）、format は biome。
    # biome 側の linter は衝突を避けるため biome.json で無効にしてある。
    - name: nextjs-lint
      root: "nextjs-app/"
      glob: "*.{ts,tsx}"
      run: mise exec -- pnpm exec eslint {staged_files}

    - name: nextjs-format
      root: "nextjs-app/"
      glob: "*.{ts,tsx,mjs,css,json}"
      run: mise exec -- pnpm exec biome format --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
