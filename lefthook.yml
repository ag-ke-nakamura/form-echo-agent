pre-commit:
  parallel: true
  jobs:
    - name: betterleaks
      run: mise exec -- betterleaks git --pre-commit --redact --staged --verbose

    # Claude Code の破壊的コマンドガードの回帰テスト。
    # 誤って許可する側の退行は実行時に無音で通ってしまうため、ここで止める
    # （クラッシュ系の破損は次の Bash 呼び出しが全て失敗するので即座に気付ける）。
    - name: claude-hooks-test
      glob: ".claude/hooks/**/*.py"
      run: mise exec -- python3 .claude/hooks/tests/test_guard.py

    - name: cdk-format
      root: "agentcore/cdk/"
      glob: "*.{ts,json}"
      run: mise exec -- prettier --write {staged_files}
      stage_fixed: true

    - name: formecho-agent-format
      root: "app/FormEchoAgent/"
      glob: "*.ts"
      run: mise exec -- biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - name: formecho-agent-typecheck
      root: "app/FormEchoAgent/"
      glob: "*.ts"
      run: mise exec -- npm exec tsc -- --noEmit

    - name: hono-app-format
      root: "hono-app/"
      glob: "*.ts"
      run: mise exec -- biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - name: hono-app-typecheck
      root: "hono-app/"
      glob: "*.ts"
      run: mise exec -- bun x tsc --noEmit

    - name: nextjs-lint
      root: "nextjs-app/"
      glob: "*.{ts,tsx}"
      run: mise exec -- pnpm exec eslint {staged_files}
