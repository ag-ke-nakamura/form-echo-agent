[tools]
lefthook = "latest"
"aqua:betterleaks/betterleaks" = "latest"
node = "22"
python = "3.13"
uv = "latest"
bun = "1.4.0"
pnpm = "10.23.0"
"aqua:aws/aws-cli" = "latest"
gh = "latest"
jq = "latest"

# biome と prettier は意図的にここに置かない。
#
# mise の PATH 経由でフォーマッターを供給すると、版が package-lock.json /
# pnpm-lock.yaml の外に出るため (1) mise は latest を実行時解決するので手元と CI で
# 版が食い違い得る (2) dependabot は package.json しか見ないので更新 PR が永遠に
# 出ない、という2つの穴ができる。
#
# 各プロジェクトの devDependency として持たせ、lefthook からは npm exec / pnpm exec
# 経由で node_modules/.bin を引くこと。整形結果はロックファイルで再現可能になる。

# 検証環境の3プロセスを1コマンドで並行起動する。
#
# ルートの package.json は pnpm workspace の宣言専用でスクリプトを持たない（ADR-0015）ため、
# ここが置き場所になる。`:::` は mise がタスクを並行実行する区切り。
# Runtime は agentcore CLI が「自分のいるフォルダがプロジェクトルート」として
# 振る舞うため、必ず agent-app/ で起動する。
[tasks.dev]
description = "フロントエンド・BFF・Runtime を並行起動する"
run = "mise run dev:runtime ::: dev:bff ::: dev:web"

[tasks."dev:runtime"]
description = "AgentCore Runtime をローカル実行する (http://localhost:8080)"
dir = "agent-app"
run = "agentcore dev --logs --skip-deploy"

# 交通ICドメインエージェントに Web 検索を持たせる（#46）。ここに書かないと、
# 手元で動かした画面では経路を尋ねても答えが返らず `sources` も空のままになる。
#
# 値は `agentcore/.cli/deployed-state.json` の `gatewayUrl`（デプロイの結果として
# コミットされている）。秘密ではない — Gateway は SigV4 で守られており、URL を
# 知っているだけでは叩けない。デプロイ先を張り替えたらここも直す。
[tasks."dev:runtime".env]
FORMECHO_WEB_SEARCH_GATEWAY_URL = "https://formecho-formechowebsearch-0sndza4xhi.gateway.bedrock-agentcore.ap-northeast-1.amazonaws.com/mcp"

[tasks."dev:bff"]
description = "BFF を起動する (http://localhost:8787)"
dir = "hono-app"
run = "pnpm run dev"

# hono-app・nextjs-app はローカル起動のまま、BFF だけデプロイ済み Runtime を向ける（#45）。
# `dev:runtime` を含めないのはそのため。env はこのタスクのシェルに立ち、
# `mise run dev:bff` の子プロセスへ普通の環境変数として伝わる。
[tasks."dev:deployed"]
description = "BFF だけデプロイ済み Runtime を向ける。フロントエンドはローカル起動のまま (http://localhost:3000)"
run = "mise run dev:bff ::: dev:web"

[tasks."dev:deployed".env]
FORMECHO_RUNTIME_CLIENT = "deployed"
# 値は `agentcore/.cli/deployed-state.json` の `runtimeArn`（デプロイの結果として
# コミットされている）。`FORMECHO_WEB_SEARCH_GATEWAY_URL` と同じ運用 — デプロイ先を
# 張り替えたらここも手で更新する。region はこの ARN 文字列から実装側がパースするので
# 専用の env は増やさない。AWS 認証はローカルの ambient credential provider chain に
# 任せる（`aws sso login` 等を事前に済ませている前提）— ここで AWS_PROFILE 等は固定しない。
FORMECHO_RUNTIME_ARN = "arn:aws:bedrock-agentcore:ap-northeast-1:122664578519:runtime/FormEcho_FormEchoAgent-b7lxcgCRfb"

[tasks."dev:web"]
description = "フロントエンドを起動する (http://localhost:3000)"
dir = "nextjs-app"
run = "pnpm run dev"

# フロントエンドのビルドと `cdk deploy` を1コマンドにまとめる（#137）。
#
# WHY 分けないか: 手順書に2つ並べると、ビルドを忘れた回に古い成果物がそのまま
# 配信され、しかも `cdk deploy` は成功して見える。CDK 側にも成果物の存在確認は
# あるが、それが捕まえるのは「一度もビルドしていない」場合だけで「古い」は通る。
#
# デプロイは人が手元から実行する（`agentcore deploy` と同じ慣習。CI にデプロイ用の
# OIDC ロールは作らない）。AWS 認証はローカルの ambient credential provider chain に
# 任せる。
#
# Basic 認証のパスワードは synth 時に context で注入する（#138）。リポジトリに
# 直書きすると CI の secret scan と正面衝突するので、ここは環境変数を素通しする
# だけにする。未設定なら空文字が渡り、スタック側が理由の分かるエラーで止める。
[tasks.deploy]
description = "フロントエンドをビルドして CloudFront + S3 へデプロイする（要 FORMECHO_BASIC_AUTH_PASSWORD）"
depends = ["deploy:web"]
dir = "infra"
run = 'npm run cdk -- deploy --context basicAuthPassword="$FORMECHO_BASIC_AUTH_PASSWORD"'

# `NEXT_PUBLIC_API_BASE_URL` を空文字にすると `hc` が相対パスを叩く（空文字は
# nullish ではないので既定値の localhost には落ちない）。単一オリジンなので
# これでフロントエンドのコード改修は0行になる。ローカル起動は既定値のまま。
[tasks."deploy:web"]
description = "デプロイ用にフロントエンドをビルドする（API は相対パス）"
dir = "nextjs-app"
run = "pnpm run build"

[tasks."deploy:web".env]
NEXT_PUBLIC_API_BASE_URL = ""
