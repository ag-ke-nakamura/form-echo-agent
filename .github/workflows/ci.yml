name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || format('{0}~1', github.sha) }}
          HEAD_SHA: ${{ github.sha }}
        run: betterleaks git --log-opts="${BASE_SHA}..${HEAD_SHA}"

  agentcore-cdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-app/agentcore/cdk
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run build
      # npm test（生成された test/cdk.test.ts）は意図的に実行しない。
      # 全リソースが空の spec で synth し、出力が1つあることだけを確認する
      # 内容で、実際の agentcore.json を検証していない（CDK 自身が
      # "Resources section must exist and be non-empty" と警告する）。
      # 型検査は ts-jest 経由で上の npm run build と重複するだけなので、
      # build に対する固有の価値がない。
      #
      # 意味のある検証は「実際の agentcore.json が synth できるか」= cdk synth
      # だが、aws-targets.json が空のため現時点では実行できない
      # （"No deployment targets configured" で失敗する）。
      # ターゲットが設定されたら cdk synth をここに追加すること。

  formecho-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-app/app/FormEchoAgent
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build

  hono-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hono-app
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck

  nextjs-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-app
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
