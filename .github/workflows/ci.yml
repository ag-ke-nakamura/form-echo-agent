name: CI

on:
  pull_request:
  push:
    branches: [main]

# mise-action は mise.jdx.dev/VERSION で版を解決してから GitHub releases から
# バイナリを落とすため、上流がタグと VERSION を進めた後 release を publish する
# までの間に走ると 404 で全ジョブが落ちる（2026-09-08 に実際に起きた。#143）。
# minimum_release_age で「その閾値より古い安定版だけ入れる」ことにして、その窓を
# こちらから避ける。version を固定しないのは、剥がす必要のある回避コミットにも、
# 版を手で追う手間にも、dependabot の死角にもしないため。
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 24h
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || format('{0}~1', github.sha) }}
          HEAD_SHA: ${{ github.sha }}
        run: betterleaks git --log-opts="${BASE_SHA}..${HEAD_SHA}"

  agentcore-cdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-app/agentcore/cdk
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 24h
      - run: npm ci
      # cdk synth は esbuild で agent-app/app/FormEchoAgent の import グラフを
      # バンドルするため、そちらの node_modules（zod・@strands-agents/sdk 等）が
      # 無いと "Could not resolve" で失敗する（agentcore-cdk 自身の依存とは別プロジェクト）。
      - run: npm ci
        working-directory: agent-app/app/FormEchoAgent
      - run: npx prettier --check .
      - run: npm run build
      # npm test（生成された test/cdk.test.ts）は意図的に実行しない。
      # 全リソースが空の spec で synth し、出力が1つあることだけを確認する
      # 内容で、実際の agentcore.json を検証していない（CDK 自身が
      # "Resources section must exist and be non-empty" と警告する）。
      # 型検査は ts-jest 経由で上の npm run build と重複するだけなので、
      # build に対する固有の価値がない。
      #
      # 意味のある検証は「実際の agentcore.json が synth できるか」= cdk synth。
      # aws-targets.json にターゲットを設定した（#45）ので実行できる。AWS 資格情報は
      # 要らない（account/region はテンプレートの値として埋め込むだけで、synth 自体は
      # AWS を呼ばない）。
      - run: npx cdk synth

  agent-infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-app/infra
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 24h
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run build
      - run: npm run test

  formecho-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-app/app/FormEchoAgent
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 24h
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      # typecheck はテストまで含めて型検査する（build は dist に混ぜないため除いている）。
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  hono-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hono-app
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 24h
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test

  nextjs-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs-app
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 24h
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
