version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/agentcore/cdk"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/app/FormEchoAgent"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/nextjs-app"
    schedule:
      interval: "weekly"

  # pnpm-lock.yaml は npm エコシステムが扱う（bun.lock から移行済み）
  - package-ecosystem: "npm"
    directory: "/hono-app"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
