version: 2

# @types/node のメジャー更新は無視する。
#
# ランタイムは mise.toml で node 22 に固定してあり、型定義がそれを超えて先に進む
# 理由がない。26 系の型を入れると、実際には存在しない API が型として見えてしまう。
# node のメジャーを上げるときは mise.toml と一緒に、この ignore を外して上げること。
updates:
  - package-ecosystem: "npm"
    directory: "/agentcore/cdk"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript のメジャー更新は、生成された tsconfig.json が古い
      # moduleResolution を使っているため通らない（実測）。
      #
      #   "moduleResolution": "Node"   ← node10 相当
      #   TS 6 → error TS5107: deprecated and will stop functioning in TypeScript 7.0
      #   TS 7 → error TS5108: has been removed
      #
      # tsconfig.json は agentcore CLI の生成物で編集不可の方針のため、
      # ここでは上げられない。CLI が新しい moduleResolution を出力するように
      # なったら、この ignore を外すこと。
      #
      # 5.x のパッチ・マイナー更新は通るので無視しない。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/app/FormEchoAgent"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/nextjs-app"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # pnpm-lock.yaml は npm エコシステムが扱う（bun.lock から移行済み）
  - package-ecosystem: "npm"
    directory: "/hono-app"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
